services:
  postgres:
    image: postgres:16-alpine
    container_name: unifiedstack-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: unifiedstack
      POSTGRES_USER: strapi
      POSTGRES_PASSWORD: strapi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strapi -d unifiedstack"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
